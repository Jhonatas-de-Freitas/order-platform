name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Integration tests skip themselves on a machine without Docker. Here that would hide a broken runner.
      - name: Refuse skipped tests
        run: |
          reports=$(ls */target/*-reports/TEST-*.xml)
          if grep -L 'skipped="0"' $reports | grep .; then
            echo "::error::The reports above have skipped tests"
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check health endpoints and API docs
        run: |
          for port in 8081 8082 8083; do
            curl -fsS "http://localhost:$port/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'
            echo
            curl -fsSL -o /dev/null -w "swagger-ui on $port: %{http_code}\n" "http://localhost:$port/swagger-ui.html"
          done

      - name: Check topics
        run: |
          topics=$(docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe)
          echo "$topics"
          test "$(echo "$topics" | grep -c 'PartitionCount: 3')" -eq 6

      - name: Run the scenarios
        run: ./scripts/smoke-test.sh

      - name: Send an invalid message to the dead letter topic
        run: ./scripts/dead-letter-demo.sh

      - name: Check metrics and the Grafana dashboard
        run: ./scripts/check-metrics.sh

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    needs: [build, e2e]
    # Images only go out from main, and only once the repository is public.
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SERVICE"
          docker build -f "$SERVICE/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:latest" -t "$image:${GITHUB_SHA::7}" .
          docker push --all-tags "$image"
