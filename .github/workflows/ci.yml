name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Integration tests skip themselves on a machine without Docker. Here that would hide a broken runner.
      - name: Refuse skipped tests
        run: |
          reports=$(ls */target/*-reports/TEST-*.xml)
          if grep -L 'skipped="0"' $reports | grep .; then
            echo "::error::The reports above have skipped tests"
            exit 1
          fi

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check health endpoints
        run: |
          for port in 8081 8082 8083; do
            curl -fsS "http://localhost:$port/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'
          done

      - name: Check topics
        run: |
          topics=$(docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe)
          echo "$topics"
          test "$(echo "$topics" | grep -c 'PartitionCount: 3')" -eq 6

      # The full scenarios come with the smoke test. Until then this is what shows that the services
      # that are ready understand each other's events.
      - name: Check that orders reach the inventory
        run: |
          place_order() {
            body='{"customerId":"c-1001","customerName":"Ana Souza","customerEmail":"ana@exemplo.com","items":[{"productId":"'$1'","quantity":'$2'}]}'
            curl -fsS -X POST http://localhost:8081/orders -H 'Content-Type: application/json' -d "$body" | jq -r .id
          }
          wait_until_settled() {
            for attempt in $(seq 1 30); do
              status=$(curl -fsS "http://localhost:8081/orders/$1" | jq -r .status)
              if [ "$status" != "PENDING" ]; then return 0; fi
              sleep 1
            done
            echo "::error::Order $1 is still PENDING"
            return 1
          }
          keyboard=11111111-1111-1111-1111-111111111111
          headset=44444444-4444-4444-4444-444444444444

          reserved=$(place_order $keyboard 2)
          wait_until_settled "$reserved"
          curl -fsS "http://localhost:8081/orders/$reserved" | tee /dev/stderr | jq -e '.totalAmount == 699.8 and .items[0].productName == "Teclado Mecânico"'
          curl -fsS "http://localhost:8082/reservations/$reserved" | tee /dev/stderr | jq -e '.status == "RESERVED"'
          curl -fsS "http://localhost:8082/products/$keyboard" | tee /dev/stderr | jq -e '.availableQuantity == 48'

          rejected=$(place_order $headset 1)
          wait_until_settled "$rejected"
          curl -fsS "http://localhost:8081/orders/$rejected" | tee /dev/stderr | jq -e '.status == "CANCELLED" and .cancellationReason == "OUT_OF_STOCK"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8082/reservations/$rejected")" -eq 404

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
