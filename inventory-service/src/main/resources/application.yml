server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
    listener:
      # One thread per partition of orders.events, so orders are reserved in parallel.
      # What keeps the balance right is the row lock on the products, not a single consumer thread.
      concurrency: 3
    producer:
      acks: all
      properties:
        # Short limits so a broker that is down fails the outbox batch quickly instead of holding
        # its database transaction for the one minute the client waits by default.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

app:
  outbox:
    poll-interval: 500ms
    batch-size: 100
  consumer:
    retry:
      # Attempts in total, counting the first one. The wait grows from one attempt to the next.
      max-attempts: 4
      initial-interval: 200ms
      multiplier: 2.0
      max-interval: 5s

logging:
  pattern:
    correlation: "[%X{orderId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
