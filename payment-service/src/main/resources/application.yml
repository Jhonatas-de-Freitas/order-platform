server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:29092

app:
  payment:
    # The simulated charge refuses any amount above this.
    approval-limit: ${PAYMENT_APPROVAL_LIMIT:5000.00}

logging:
  pattern:
    correlation: "[%X{orderId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
